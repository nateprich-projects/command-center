<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Command Center — Stage board trial</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0 auto;
        max-width: 72rem;
        padding: 1.5rem 1rem 4rem;
        line-height: 1.45;
      }
      .eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; opacity: 0.7; margin: 0; }
      h1 { margin: 0.25rem 0 0; font-size: 1.6rem; }
      .lede { opacity: 0.8; max-width: 60ch; }
      .snapshot-status { opacity: 0.7; }
      .stage { margin-top: 2rem; }
      .stage > h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      .stage-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
      .stage-item {
        border-top: 1px solid currentColor;
        padding: 0.6rem 0;
      }
      .stage-item a { color: inherit; font-weight: 600; }
      .stage-meta { opacity: 0.75; font-size: 0.9rem; }
      .empty { opacity: 0.7; }
    </style>
    <script type="module" src="/stages.js"></script>
  </head>
  <body>
    <header>
      <p class="eyebrow">Command Center trial</p>
      <h1>Stage board</h1>
      <p class="lede">Today's stage board in the snapshot's own order
        (<code>projected_pull_order</code>, as published). This page never
        re-sorts; it shows each stage's items exactly as the snapshot lists
        them. <a href="/">Back to the current dashboard</a>.</p>
      <p id="stages-status" class="snapshot-status" role="status">Loading snapshot…</p>
    </header>
    <main id="stages-board"></main>
  </body>
</html>
