name: watchdog

# Checks the heartbeats each run writes, and files an issue when something has
# gone quiet or is dying.
#
# This lives in Actions precisely because the watchdog cannot live inside the
# thing it watches: both routines require their app to be open on the Mac mini,
# and an app that quit is invisible to every other signal on a machine that is
# otherwise fine.
#
# It watches OUTCOME, not just liveness. "Ran, skipped, over pace" is healthy —
# arguably the system working. "Started and never finished", three times, is not.

on:
  schedule:
    - cron: "17 * * * *"     # hourly, off the hour so it never races a run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: [self-hosted, linux, x64, hobby-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub CLI is available
        # The hobby-linux runners serve CI, which never shells out to `gh`,
        # and they have no passwordless sudo (first dispatch, run
        # 38063285461). When the image lacks gh, fetch a pinned,
        # checksum-verified release into this run's temp directory and put
        # it on PATH; a no-op otherwise. Nothing changes on the micro-PC.
        env:
          GH_CLI_VERSION: "2.63.0"
        run: |
          set -eu
          if ! command -v gh >/dev/null 2>&1; then
            archive="gh_${GH_CLI_VERSION}_linux_amd64"
            base="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
            dir="$RUNNER_TEMP/gh-cli"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/$archive.tar.gz" "$base/$archive.tar.gz"
            curl -fsSL -o "$dir/checksums.txt" "$base/gh_${GH_CLI_VERSION}_checksums.txt"
            (cd "$dir" && grep " $archive.tar.gz\$" checksums.txt | sha256sum -c -)
            tar -xzf "$dir/$archive.tar.gz" -C "$dir"
            echo "$dir/$archive/bin" >> "$GITHUB_PATH"
            "$dir/$archive/bin/gh" --version
          else
            gh --version
          fi

      - name: Check heartbeats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/watchdog.py
