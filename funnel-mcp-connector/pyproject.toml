[project]
name = "command-center-mcp"
version = "0.1.0"
description = "Authenticated MCP read and gate tools for the Command Center funnel"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.2",
    "uvicorn==0.35.0",
    "httpx==0.28.1",
]

[project.scripts]
command-center-mcp = "funnel_mcp.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_mcp"]
