name: overseer-filing

# Files issues the Claude Code Projects overseers create (#2418) into
# Project 2. Cloud threads file over repo-scoped REST, which cannot reach
# user-owned Projects (probe 2 failed, #2438), so this hobby-linux job adds
# the filed issue and sets Status Ideas, Origin agent, Risk, Needs and Domain
# from the `<!-- command-center-routing -->` block in its body (#2512).
#
# `issues: opened` covers issues filed in this repo. Issues filed in the
# other overseer repos (Fantasy-GM, The-League, AFL) arrive by dispatch:
# `repository_dispatch` type `overseer-filed` with client_payload
# `issue_repo` and `issue_number`, or the equivalent `workflow_dispatch`
# inputs. An unknown or missing routing value fails closed: the item is left
# unset and a comment says why; routing is never defaulted.

on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [overseer-filed]
  workflow_dispatch:
    inputs:
      issue_repo:
        description: "Owner-qualified repo holding the filed issue"
        required: true
      issue_number:
        description: "Issue number to file into Project 2"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  file:
    runs-on: [self-hosted, linux, x64, hobby-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub CLI is available
        # The hobby-linux runners serve CI, which never shells out to `gh`,
        # and they have no passwordless sudo (first watchdog dispatch, run
        # 38063285461). When the image lacks gh, fetch a pinned,
        # checksum-verified release into this run's temp directory and put
        # it on PATH; a no-op otherwise. Nothing changes on the micro-PC.
        env:
          GH_CLI_VERSION: "2.63.0"
        run: |
          set -eu
          if ! command -v gh >/dev/null 2>&1; then
            archive="gh_${GH_CLI_VERSION}_linux_amd64"
            base="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
            dir="$RUNNER_TEMP/gh-cli"
            mkdir -p "$dir"
            curl -fsSL -o "$dir/$archive.tar.gz" "$base/$archive.tar.gz"
            curl -fsSL -o "$dir/checksums.txt" "$base/gh_${GH_CLI_VERSION}_checksums.txt"
            (cd "$dir" && grep " $archive.tar.gz\$" checksums.txt | sha256sum -c -)
            tar -xzf "$dir/$archive.tar.gz" -C "$dir"
            echo "$dir/$archive/bin" >> "$GITHUB_PATH"
            "$dir/$archive/bin/gh" --version
          else
            gh --version
          fi

      - name: File the overseer issue into Project 2
        env:
          GH_TOKEN: ${{ secrets.PROJECT_FILING_TOKEN }}
        run: python3 .github/scripts/overseer_filing.py
