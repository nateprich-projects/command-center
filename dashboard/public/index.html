<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Command Center</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-text">
        <p class="eyebrow">Command Center</p>
        <h1>Funnel</h1>
        <p id="snapshot-status" class="snapshot-status" role="status">Loading snapshot…</p>
      </div>
    </header>
    <main>
      <section class="panel" aria-labelledby="waiting-heading">
        <h2 id="waiting-heading" class="visually-hidden">Waiting on you</h2>
        <div id="waiting"></div>
      </section>
      <section class="panel" aria-labelledby="board-heading">
        <div class="panel-head">
          <h2 id="board-heading">Projects</h2>
          <div class="legend" aria-label="Pip legend">
            <span class="legend-item"><i class="pip pip-open"></i>open</span>
            <span class="legend-item"><i class="pip pip-submitted"></i>PR submitted</span>
            <span class="legend-item"><i class="pip pip-approved"></i>PR approved</span>
            <span class="legend-item"><i class="pip pip-blocked"></i>blocked</span>
            <span class="legend-item"><i class="pip pip-closed"></i>closed</span>
          </div>
        </div>
        <div id="board"></div>
      </section>
    </main>
    <template id="empty-state">
      <p class="empty">Nothing is waiting on you.</p>
    </template>
  </body>
</html>
